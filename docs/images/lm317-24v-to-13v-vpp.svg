<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">LM317 adjustable regulator: 24 volt DC input to approximately 13 volt VPP</title>
  <desc id="desc">A standard adjustable LM317 regulator circuit. R1 is 120 ohms from output to adjust, R2 is 1.12 kilohms from adjust to common ground. A 0.1 microfarad input capacitor and a 1 microfarad output capacitor are shown. The output is approximately 13 volts and is VPP only; target VDD is supplied separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#17212e"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17212e; }
      .wire { fill: none; stroke: #17212e; stroke-width: 3; stroke-linecap: square; stroke-linejoin: round; }
      .thin { fill: none; stroke: #17212e; stroke-width: 2.5; }
      .component { fill: #fff; stroke: #17212e; stroke-width: 2.5; }
      .label { font-size: 18px; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; }
      .bold { font-weight: 700; }
      .callout { fill: #eef4f8; stroke: #9aabba; stroke-width: 1.5; }
      .warning { fill: #fff5df; stroke: #b37500; stroke-width: 1.5; }
      .dot { fill: #17212e; }
    </style>
  </defs>
  <rect width="1120" height="700" fill="#ffffff"/>
  <text x="42" y="48" font-size="27" font-weight="700">24 V DC → ≈13.0 V VPP · LM317 adjustable regulator</text>
  <text x="42" y="77" class="small">Reference supply circuit · use a regulated, current-limited 24 V DC source (not 24 V AC).</text>

  <!-- Input supply and common return -->
  <circle cx="112" cy="274" r="42" class="component"/>
  <text x="112" y="266" text-anchor="middle" font-size="22" font-weight="700">+</text>
  <text x="112" y="291" text-anchor="middle" font-size="22" font-weight="700">−</text>
  <text x="112" y="345" text-anchor="middle" class="label bold">24 V DC</text>
  <text x="112" y="367" text-anchor="middle" class="tiny">current-limited</text>
  <path d="M154 274 H320 V250 H430" class="wire"/>
  <path d="M112 316 V552 H980" class="wire"/>
  <circle cx="320" cy="274" r="5" class="dot"/>

  <!-- LM317 regulator: pin numbers reflect TI TO-220 top/front pinout -->
  <rect x="430" y="202" width="230" height="154" rx="2" class="component"/>
  <text x="545" y="245" text-anchor="middle" font-size="24" font-weight="700">LM317</text>
  <text x="545" y="274" text-anchor="middle" class="small">adjustable regulator</text>
  <path d="M375 250 H430" class="wire"/>
  <text x="380" y="232" text-anchor="end" class="small bold">3 · IN</text>
  <path d="M660 250 H900" class="wire"/>
  <text x="675" y="232" class="small bold">2 · OUT (tab)</text>
  <path d="M545 356 V430" class="wire"/>
  <text x="563" y="378" class="small bold">1 · ADJ</text>

  <!-- Feedback divider: R1 from OUT to ADJ, R2 from ADJ to common -->
  <path d="M760 250 V293" class="wire"/>
  <rect x="744" y="293" width="32" height="66" class="component"/>
  <path d="M760 359 V430 H650" class="wire"/>
  <text x="790" y="319" class="label bold">R1</text>
  <text x="790" y="342" class="small">120 Ω, 1%</text>
  <path d="M545 430 H650" class="wire"/>
  <circle cx="650" cy="430" r="5" class="dot"/>
  <path d="M650 430 V462" class="wire"/>
  <rect x="634" y="462" width="32" height="58" class="component"/>
  <path d="M650 520 V552" class="wire"/>
  <text x="682" y="484" class="label bold">R2</text>
  <text x="682" y="507" class="small">1.12 kΩ, 1%</text>

  <!-- Input bypass capacitor -->
  <path d="M320 274 V425" class="wire"/>
  <path d="M298 425 H342 M298 438 H342" class="thin"/>
  <path d="M320 438 V552" class="wire"/>
  <text x="270" y="412" text-anchor="end" class="label bold">Cin</text>
  <text x="270" y="435" text-anchor="end" class="small">0.1 µF, 50 V</text>

  <!-- Output capacitor -->
  <path d="M850 250 V425" class="wire"/>
  <path d="M828 425 H872 M828 438 H872" class="thin"/>
  <path d="M850 438 V552" class="wire"/>
  <circle cx="850" cy="250" r="5" class="dot"/>
  <text x="880" y="413" class="label bold">Cout</text>
  <text x="880" y="436" class="small">1.0 µF, 25 V</text>

  <!-- Regulated output -->
  <path d="M900 250 H986" class="wire" marker-end="url(#arrow)"/>
  <text x="985" y="218" text-anchor="end" class="label bold">≈13.0 V VPP</text>
  <text x="875" y="282" class="small">To board's</text>
  <text x="875" y="303" class="small">VPP input (JP1)</text>
  <text x="972" y="580" text-anchor="end" class="label bold">Common 0 V / GND</text>

  <!-- Explanatory notes -->
  <rect x="42" y="600" width="498" height="66" rx="8" class="callout"/>
  <text x="60" y="626" class="small bold">Set point:</text>
  <text x="150" y="626" class="small">VOUT = 1.25 × (1 + R2/R1) + IADJ × R2</text>
  <text x="60" y="651" class="small">With 120 Ω / 1.12 kΩ, nominal output is about 13.0 V.</text>

  <rect x="558" y="600" width="520" height="66" rx="8" class="warning"/>
  <text x="576" y="626" class="small bold">VPP rail only:</text>
  <text x="710" y="626" class="small">PIC VDD comes separately from the programmer (D2).</text>
  <text x="576" y="651" class="small">Check LM317 dissipation: P ≈ (24 − 13) × actual load current.</text>
</svg>
