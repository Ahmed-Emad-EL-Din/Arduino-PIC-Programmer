name: Windows desktop package

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up MSYS2 for the upstream Windows host helper
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build and smoke-test ArdPicProg Windows host
        shell: msys2 {0}
        run: bash packaging/build_host_windows.sh

      - name: Install Arduino CLI and AVR core
        uses: arduino/setup-arduino-cli@v2

      - name: Compile ProgramPic firmware and stage avrdude
        shell: pwsh
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
          ./packaging/build_firmware.ps1

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run static checks and test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: "${{ github.workspace }}/src;${{ github.workspace }}"
        run: |
          python -m compileall -q src app
          if ($LASTEXITCODE -ne 0) { throw 'Python compileall failed.' }
          New-Item -ItemType Directory -Force 'test-results' | Out-Null
          python -m pytest -q --junitxml=test-results/junit.xml
          $TestExit = $LASTEXITCODE
          if ($TestExit -ne 0 -and (Test-Path 'test-results/junit.xml')) {
            [xml]$Report = Get-Content 'test-results/junit.xml' -Raw
            $FailureNodes = $Report.SelectNodes('//failure | //error')
            $Details = ($FailureNodes | ForEach-Object {
              $Case = $_.ParentNode
              $Text = ($_.GetAttribute('message') + ' ' + $_.InnerText) -replace '\s+', ' '
              "$($Case.GetAttribute('classname')).$($Case.GetAttribute('name')): $Text"
            }) -join ' | '
            if ($Details.Length -gt 2000) { $Details = $Details.Substring(0, 2000) }
            "### Pytest failure`n`n$Details" | Add-Content $env:GITHUB_STEP_SUMMARY
            Write-Output "::error title=Pytest failure::$Details"
          }
          if ($TestExit -ne 0) { exit $TestExit }
          'Python compileall and pytest passed.' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload test report for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Arduino-PIC-Programmer-test-report
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload real Qt UI screenshots for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Arduino-PIC-Programmer-UI-screenshots
          path: artifacts/ui/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Build portable PyInstaller application
        run: python -m PyInstaller --clean --noconfirm packaging/ardpicprog.spec

      - name: Validate package inputs
        shell: pwsh
        run: |
          $Package = 'dist/Arduino-PIC-Programmer'
          $Internal = Join-Path $Package '_internal'
          $Required = @(
            "$Package/Arduino-PIC-Programmer.exe",
            "$Internal/tools/ardpicprog.exe",
            "$Internal/tools/avrdude/avrdude.exe",
            "$Internal/tools/avrdude/avrdude.conf",
            "$Internal/docs/USER_GUIDE.md",
            "$Internal/assets/reference/ArdPicProg_1_8_horo.png",
            "$Internal/licenses/LICENSE",
            "$Internal/licenses/LGPL-3.0.txt",
            "$Internal/licenses/THIRD_PARTY_NOTICES.md",
            "$Internal/licenses/COPYING",
            "$Internal/licenses/UPSTREAM.md"
          )
          foreach ($Path in $Required) {
            if (!(Test-Path $Path)) { throw "Required package file missing: $Path" }
          }
          $BoardKeys = @('uno', 'nano_new', 'nano_old', 'pro_mini_5v', 'mega2560', 'leonardo', 'micro')
          foreach ($Key in $BoardKeys) {
            $Firmware = "$Internal/firmware/precompiled/$Key.hex"
            if (!(Test-Path $Firmware)) { throw "ProgramPic firmware missing for $Key." }
          }
          $QtPlatform = Get-ChildItem $Internal -Recurse -File -Filter 'qwindows.dll' | Select-Object -First 1
          if (!$QtPlatform) { throw 'Bundled Qt Windows platform plugin (qwindows.dll) missing.' }
          $SourceDlls = Get-ChildItem 'tools/avrdude' -File -Filter '*.dll'
          foreach ($Dll in $SourceDlls) {
            if (!(Test-Path (Join-Path "$Internal/tools/avrdude" $Dll.Name))) {
              throw "avrdude dependency DLL missing from package: $($Dll.Name)"
            }
          }

      - name: Smoke-test packaged app startup without hardware
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $Exe = (Resolve-Path 'dist/Arduino-PIC-Programmer/Arduino-PIC-Programmer.exe').Path
          $Process = Start-Process -FilePath $Exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $Process.Refresh()
            if ($Process.HasExited) {
              throw "Packaged application exited during startup with code $($Process.ExitCode)."
            }
            'Packaged application launched and stayed open without hardware.' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          finally {
            $Process.Refresh()
            if (!$Process.HasExited) { Stop-Process -Id $Process.Id -Force }
          }

      - name: Create portable ZIP and SHA-256 checksum
        shell: pwsh
        run: |
          $Zip = 'dist/Arduino-PIC-Programmer-Windows-x64.zip'
          Compress-Archive -Path 'dist/Arduino-PIC-Programmer/*' -DestinationPath $Zip -Force
          $Hash = (Get-FileHash -Path $Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  Arduino-PIC-Programmer-Windows-x64.zip" | Set-Content -Path "$Zip.sha256" -Encoding ascii
          $WrittenHash = ((Get-Content -Path "$Zip.sha256" -Raw).Trim() -split ' +')[0]
          if ($WrittenHash -ne $Hash) { throw 'Generated SHA-256 sidecar does not match the candidate ZIP.' }

      - name: Upload candidate build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Arduino-PIC-Programmer-Windows-x64-candidate
          path: |
            dist/Arduino-PIC-Programmer-Windows-x64.zip
            dist/Arduino-PIC-Programmer-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
